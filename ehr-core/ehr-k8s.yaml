apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ehr-app
  template:
    metadata:
      labels:
        app: ehr-app
        tier: ehr
    spec:
      containers:
        - name: ehr-container
          image: httpd:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ehr-service
spec:
  type: NodePort
  selector:
    app: ehr-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30092